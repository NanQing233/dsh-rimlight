<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Rimlight">
  <title>Rimlight</title>
  <defs>
    <linearGradient id="rimlight-logo-arc" gradientUnits="userSpaceOnUse" x1="10" y1="44" x2="34" y2="10">
      <stop offset="0" stop-color="#4d6bfe" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#7fb0ff" stop-opacity="0.65"/>
      <stop offset="0.75" stop-color="#e6f0ff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="rimlight-logo-glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#96beff" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#4d6bfe" stop-opacity="0"/>
    </radialGradient>
    <filter id="rimlight-logo-blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round">
    <path d="M12 40 V26 Q12 12 26 12 H36" stroke="url(#rimlight-logo-arc)" stroke-width="3.6" filter="url(#rimlight-logo-blur)" opacity="0.55"/>
    <path d="M12 40 V26 Q12 12 26 12 H36" stroke="url(#rimlight-logo-arc)" stroke-width="4.6"/>
  </g>
  <circle cx="36" cy="12" r="9" fill="url(#rimlight-logo-glow)" opacity="0.8"/>
  <circle cx="36" cy="12" r="3.2" fill="#ffffff"/>
</svg>
